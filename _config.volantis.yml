############################### Article Layout ############################### > start
# 文章布局
article:
    # 文章列表页面的文章卡片布局方案
    preview:
        scheme: landscape # landscape
        # pin icon for post
        pin_icon: https://cdn.jsdelivr.net/gh/twitter/twemoji@13.0/assets/svg/1f4cc.svg
        # auto generate title if not exist
        auto_title: true # false, true
        # auto generate excerpt if not exist
        auto_excerpt: true # false, true
        # show split line or not
        line_style: dashed # hidden, solid, dashed, dotted
        # show author
        author: false # true, false
        # show readmore button
        readmore: auto # auto, always
    # 文章详情页面的文章卡片本体布局方案
    body:
        # 文章顶部信息
        # 从 meta_library 中取
        top_meta: [category, date, wordcount] #启用评论数量需在此添加
        # ----------------
        # 文章页脚组件
        footer_widget:
            # ----------------
            # 参考资料、相关资料等 (for layout: post/docs)
            references:
                title: 参考资料（References）：
                icon: fas fa-quote-left
                # 在 front-matter 中:
                #   references:
                #     - title: 某篇文章
                #       url: https://
                # 即可显示此组件。
            # ----------------
            # 相关文章，需要安装插件 (for layout: post)
            # npm i hexo-related-popular-posts
            related_posts:
                enable: false
                title: 相关文章
                icon: fas fa-bookmark
                max_count: 5
                # 设为空则不使用文章头图
                placeholder_img:
            # ----------------
            # 版权声明组件 (for layout: post)
            copyright:
                enable: true
                permalink: "本文永久地址："
                content:
                    # - '博客内容遵循 署名-非商业性使用-相同方式共享 4.0 国际 (CC BY-NC-SA 4.0) 协议'
                    - This work is licensed under a <a rel="license" href="http://creativecommons.org/licenses/by-nc/4.0/">Creative Commons Attribution-NonCommercial 4.0 International License</a>.
                    - permalink
            # ----------------
            # 打赏组件 (for layout: post)
            donate:
                enable: false
                images:
                    -  #
        # 文章底部信息
        # 从 meta_library 中取
        bottom_meta: [tags, author, share]
        # meta library
        meta_library:
            # 默认文章作者（可在 _data/author.yaml 中增加其他作者，并在 front-matter 中设置）
            # https://volantis.js.org/advanced-settings/#多人协同
            author:
                avatar: https://cn.bing.com/th?id=AMMS_fc8f99fd41ebd737a71c4e13806db9a0&w=110&h=110&c=7&rs=1&qlt=80&pcl=f9f9f9&cdv=1&dpr=2&pid=16.1
                name: Bezhuang
                url: /about
            # 文章创建日期
            date:
                icon: fas fa-calendar-alt
                title: "本文发布于："
                format: "ll" # 日期格式 http://momentjs.com/docs/
            # 文章更新日期
            updated:
                icon: fas fa-edit
                title: "本文更新于："
                format: "ll" # 日期格式 http://momentjs.com/docs/
            # 文章分类
            category:
                icon: fas fa-folder-open
            # 文章浏览计数
            counter:
                icon: fas fa-eye
                unit: "次浏览"
            # 文章评论数量：支持 valine和waline
            valinecount:
                icon: fas fa-comment-dots
                desc: "" # 条评论
            walinecount:
                icon: fas fa-comment-dots
                desc: "" # 条评论
            # 文章字数和阅读时长
            wordcount:
                icon_wordcount: fas fa-keyboard
                icon_duration: fas fa-hourglass-half
            # 文章标签
            tags:
                icon: fas fa-hashtag
            # 分享
            share:
                # - id: qq
                #   img: /assets/img/qq.png
                # - id: qzone
                #   img: /assets/img/qzone.png
                # - id: weibo
                #   img: /assets/img/weibo.png
                # - id: qrcode # 当id为qrcode时需要安装插件  npm i hexo-helper-qrcode
                #   img: /assets/img/wechat.png
                # - id: telegram
                #   img: /assets/img/telegram.png
############################### Article Layout ############################### > end

############################### Comments ############################### > start
comments:
    title: <i class='fas fa-comments'></i> 评论
    subtitle:
    service: valine # valine, twikoo, waline, minivaline, disqus, disqusjs, gitalk, vssue, livere, isso, hashover
    valine:
        # js: https://cdn.jsdelivr.net/npm/valine@1.4/dist/Valine.min.js
        path: # 全局评论地址 目前设置全局评论地址后visitor失效,这是valine的问题
        placeholder: 快来评论吧~ # 评论占位提示
        # 其他配置项按照yml格式继续填写即可 除了 [el path placeholder emojiCDN emojiMaps] 选项
        appId: SK7sx66NNd5Bw3O3jvF2MVXq-MdYXbMMI
        appKey: j5I5paEqIfWfOlCg13vU2vNq
        meta: [nick, mail, link] # valine comment header info
        requiredFields: [nick, mail]
        enableQQ: true # Unstable avatar link
        recordIP: true # Record commenter IP
        avatar: robohash # gravatar style https://valine.js.org/avatar
        pageSize: 10 # comment list page size
        lang: zh-cn
        highlight: true
        mathJax: true

############################### Comments ############################### > end

############################### Sidebar ############################### > start
sidebar:
    # 主页、分类、归档等独立页面
    for_page: [blogger, category, tagcloud, donate]
    # layout: docs/post 这类文章页面
    for_post: [toc]
    # 侧边栏组件库
    widget_library:
        # ---------------------------------------
        # blogger info widget
        blogger:
            class: blogger
            display: [desktop, mobile] # [desktop, mobile]
            avatar: /img/头像.gif
            shape: rectangle # circle, rectangle
            url: /about/
            title: Mein Blog
            subtitle: Übung macht den Meister!
            jinrishici: true
            social:
                - icon: fas fa-envelope
                  url: mailto:bezhuang@outlook.com
                - icon: fab fa-github
                  url: https://github.com/Bezhuang/
                - icon: fab fa-youtube
                  url: https://space.bilibili.com/30593492
                - icon: fas fa-rss
                  url: /atom.xml
        # ---------------------------------------
        # toc widget (valid only in articles)
        toc:
            class: toc
            display: [desktop, mobile] # [desktop, mobile]
            header:
                icon: fas fa-list
                title: 本文目录
            list_number: false
            min_depth: 2
            max_depth: 5
        # ---------------------------------------
        # category widget
        category:
            class: category
            display: [desktop]
            header:
                icon: fas fa-folder-open
                title: 文章分类
                url: /categories/
        # ---------------------------------------
        # tagcloud widget
        tagcloud:
            class: tagcloud
            display: [desktop, mobile] # [desktop, mobile]
            header:
                icon: fas fa-tags
                title: 热门标签
                url: /tags/
            min_font: 14
            max_font: 24
            color: true
            start_color: "#999"
            end_color: "#555"

        # ---------------------------------------
        # qrcode widget
        donate:
            class: qrcode
            display: [desktop, mobile] # [desktop, mobile]
            height: # Automatic height if not set
            images:
                - /img/加个微信.jpg
                - /img/微信二维码.jpg
        # ---------------------------------------
        # webinfo widget
        webinfo:
            class: webinfo
            display: [desktop]
            header:
                icon: fas fa-award
                title: 站点信息
            type:
                article:
                    enable: true
                    text: "文章数目："
                    unit: "篇"
                runtime:
                    enable: true
                    data: "2020/01/01" # 填写建站日期
                    text: "已运行时间："
                    unit: "天"
                wordcount:
                    enable: true
                    text: "本站总字数：" # 需要启用 wordcount
                    unit: "字"
                visitcounter:
                    service: leancloud # busuanzi, leancloud
                    siteuv:
                        enable: true
                        text: "本站访客数："
                        unit: "人"
                    sitepv:
                        enable: true
                        text: "本站总访问量："
                        unit: "次"
                lastupd:
                    enable: true
                    friendlyShow: true # 更友好的时间显示
                    text: "最后活动时间："
                    unit: "日"
############################### Sidebar ############################### > end

