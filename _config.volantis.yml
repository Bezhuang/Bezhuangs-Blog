############################### Custom css ############################### > start
custom_css:
    toc_smooth: true # TOC 目录平滑滚动效果
    cursor:
        enable: false
        text: https://cdn.jsdelivr.net/gh/Chiuye/Coffee-Rabbit-Cursor/Rabbit-Cursor/Rabbit-Text.cur
        pointer: https://cdn.jsdelivr.net/gh/Chiuye/Coffee-Rabbit-Cursor/Rabbit-Cursor/Rabbit-Click.cur
        default: https://cdn.jsdelivr.net/gh/Chiuye/Coffee-Rabbit-Cursor/Rabbit-Cursor/Rabbit-Personal.cur
        not-allowed: https://cdn.jsdelivr.net/gh/Chiuye/Coffee-Rabbit-Cursor/Rabbit-Cursor/Rabbit-Ban.cur
        zoom-out: https://cdn.jsdelivr.net/gh/Chiuye/Coffee-Rabbit-Cursor/Rabbit-Cursor/Rabbit-Static.cur
        zoom-in: https://cdn.jsdelivr.net/gh/Chiuye/Coffee-Rabbit-Cursor/Rabbit-Cursor/Rabbit-Static.cur
        grab: https://cdn.jsdelivr.net/gh/Chiuye/Coffee-Rabbit-Cursor/Rabbit-Cursor/Rabbit-Aim.cur
    max_width: 1080px # Sum of body width and sidebar width (This limit will be exceeded when the device width is greater than 2000px, reaching 75% of the total width)
    scrollbar:
        size: 4px
        border: 2px
    navbar:
        height: 64px
        width: max # auto, max
        effect: [shadow, blur]
    sidebar:
        effect: [shadow] # [shadow, floatable, blur]
    body:
        effect: [shadow] # [shadow, floatable, blur]
        highlight:
            language: true # show language of codeblock
            copy_btn: true
            grayscale: false # Enable grayscale effect
        text_align: # left, right, justify, center
            h1: left
            h2: left
            h3: left
            h4: left
            p: justify
    gap:
        h2: 40px # Spacing above H2 (only px unit)
        h3: 10px # Spacing above H3 (only px unit)
        h4: 5px # Spacing above H4 (only px unit)
        p: 1em # Paragraph spacing between paragraphs
        line_height: 1.5 # normal, 1.5, 1.75, 2 ...
    border_radius:
        card: 8px
        codeblock: 4px
        searchbar: 8px
        button: 4px
    fontsize:
        root: 16px
        h1: 1.75rem # 28px
        h2: 1.5rem # 24px，二级标题（带下划线）
        h3: 1.25rem # 20px
        h4: 1.125rem # 18px
        h5: 1rem # 16px
        h6: 1rem # 16px
        list: .9375rem # 15px
        meta: .875rem # 14px
        code: .875rem # 14px（正文代码与代码块）
        footnote: .78125rem # 12.5px
    # 中文优先：首选华为鸿蒙字体（HarmonyOS Sans），逐级回退到各平台自带中文黑体。
    # 不写 name/url，主题就不会再输出 src 为空的 @font-face 声明。
    fontfamily:
        logofont:
            fontfamily: '"HarmonyOS Sans SC", "HarmonyOS Sans", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif'
            weight: normal
            style: normal
        bodyfont:
            fontfamily: '"HarmonyOS Sans SC", "HarmonyOS Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif'
            weight: normal
            style: normal
        codefont:
            fontfamily: '"JetBrains Mono", "Fira Code", "Cascadia Code", "Space Mono", Menlo, Consolas, "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", monospace'
            weight: normal
            style: normal
############################### Custom css ############################### > end

